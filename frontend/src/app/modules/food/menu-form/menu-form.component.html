<div class="dialog-wrap">

  <!-- HEADER -->
  <div class="dialog-header">
    <div class="dialog-title-block">
      <div class="dialog-icon">
        <mat-icon>restaurant_menu</mat-icon>
      </div>
      <div>
        <h2 class="dialog-title">{{ isEdit ? 'Edit Item' : 'New Menu Item' }}</h2>
        <p class="dialog-sub">
          {{ isEdit ? 'Update menu item details' : 'Add a new item to the menu' }}
        </p>
      </div>
    </div>

    <button class="close-btn" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- SCROLLABLE BODY -->
  <form [formGroup]="menuForm" class="dialog-body">

    <div class="dialog-body-content">

      <div class="field-wrap">
        <label class="field-label">Item Name <span class="required">*</span></label>
        <mat-form-field appearance="outline" class="full-width">
          <input matInput formControlName="name" placeholder="e.g. Grilled Salmon"/>
          <mat-error *ngIf="menuForm.get('name')?.hasError('required')">Required</mat-error>
        </mat-form-field>
      </div>

      <div class="form-row">
        <div class="field-wrap">
          <label class="field-label">Category <span class="required">*</span></label>
          <mat-form-field appearance="outline" class="full-width">
            <mat-select formControlName="category" placeholder="Select category">
              <mat-option *ngFor="let c of categories" [value]="c.value">
                {{ c.label }}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="menuForm.get('category')?.hasError('required')">Required</mat-error>
          </mat-form-field>
        </div>

        <div class="field-wrap">
          <label class="field-label">Price <span class="required">*</span></label>
          <mat-form-field appearance="outline" class="full-width">
            <span matPrefix>$&nbsp;</span>
            <input matInput type="number" formControlName="price" placeholder="0.00"/>
            <mat-error *ngIf="menuForm.get('price')?.hasError('required')">Required</mat-error>
          </mat-form-field>
        </div>
      </div>

      <div class="field-wrap">
        <label class="field-label">Description</label>
        <mat-form-field appearance="outline" class="full-width">
          <textarea matInput formControlName="description" rows="3"
                    placeholder="Brief description of the dish..."></textarea>
        </mat-form-field>
      </div>

      <div class="toggle-row">
        <span class="field-label" style="margin:0">Available on Menu</span>
        <mat-slide-toggle formControlName="is_available" color="accent"></mat-slide-toggle>
      </div>

    </div>

  </form>

  <!-- FOOTER -->
  <div class="dialog-footer">
    <button class="btn-cancel" (click)="onCancel()">Cancel</button>

    <button class="btn-save"
            [disabled]="menuForm.invalid"
            (click)="onSave()">
      <mat-icon>{{ isEdit ? 'save' : 'add' }}</mat-icon>
      {{ isEdit ? 'Save Changes' : 'Add Item' }}
    </button>
  </div>

</div>
