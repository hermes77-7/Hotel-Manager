<div class="dialog-wrap">
  <div class="dialog-header">
    <div class="dialog-title-block">
      <div class="dialog-icon"><mat-icon>fact_check</mat-icon></div>
      <div>
        <h2 class="dialog-title">New Inspection Report</h2>
        <p class="dialog-sub">Log a room hygiene inspection</p>
      </div>
    </div>
    <button class="close-btn" (click)="onCancel()"><mat-icon>close</mat-icon></button>
  </div>

  <form [formGroup]="reportForm" class="dialog-body">

    <div class="form-row">
      <div class="field-wrap">
        <label class="field-label">Room <span class="required">*</span></label>
        <mat-form-field appearance="outline" class="full-width">
          <mat-select formControlName="room" placeholder="Select room">
            <mat-option *ngFor="let r of rooms" [value]="r.id">
              Room {{ r.number }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="reportForm.get('room')?.hasError('required')">Required</mat-error>
        </mat-form-field>
      </div>
      <div class="field-wrap">
        <label class="field-label">Rating <span class="required">*</span></label>
        <mat-form-field appearance="outline" class="full-width">
          <mat-select formControlName="rating" placeholder="Select rating">
            <mat-option *ngFor="let r of ratings" [value]="r.value">
              {{ r.label }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="reportForm.get('rating')?.hasError('required')">Required</mat-error>
        </mat-form-field>
      </div>
    </div>

    <div class="field-wrap">
      <label class="field-label">Notes</label>
      <mat-form-field appearance="outline" class="full-width">
        <textarea matInput formControlName="notes" rows="2"
                  placeholder="General observations..."></textarea>
      </mat-form-field>
    </div>

    <div class="field-wrap">
      <label class="field-label">Issues Found</label>
      <mat-form-field appearance="outline" class="full-width">
        <textarea matInput formControlName="issues_found" rows="2"
                  placeholder="Describe any issues found..."></textarea>
      </mat-form-field>
    </div>

    <div class="toggle-row">
      <span class="field-label" style="margin:0">Inspection Passed</span>
      <mat-slide-toggle formControlName="passed" color="accent"></mat-slide-toggle>
    </div>

  </form>

  <div class="dialog-footer">
    <button class="btn-cancel" (click)="onCancel()">Cancel</button>
    <button class="btn-save" [disabled]="reportForm.invalid" (click)="onSave()">
      <mat-icon>fact_check</mat-icon>
      Submit Report
    </button>
  </div>
</div>
